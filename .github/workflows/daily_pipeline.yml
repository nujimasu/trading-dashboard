name: Daily Pipeline (Light)

# GH Actions 分数節約のため軽量化:
# - 価格差分DL、市場ヘルス、ニュースのみ更新
# - swing_store を持たないためスイングスキャンは実行しない

on:
  schedule:
    # Polygon 無料枠の EOD 配信遅延に備え、早期取得と翌朝の再取得を行う。
    # Stage2 は 6 営業日を遡って upsert するため、朝の再実行で前営業日が埋まる。
    - cron: "30 22 * * 1-5"   # JST 7:30 — 取れれば取る（早い方）
    - cron: "0 5 * * 2-6"     # JST 14:00 — 確実に取る（ET 前日+α）
  workflow_dispatch:  # 手動実行も可能

jobs:
  run-daily-light:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Polygon grouped とニュース取得の余裕を確保

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily-light pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python -u pipeline/run_pipeline.py --daily-light  # -u: ログを即時出力
