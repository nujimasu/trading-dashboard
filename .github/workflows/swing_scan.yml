name: Swing Scan

on:
  schedule:
    # Polygon 無料枠の EOD 配信遅延に備え、早期取得と翌朝の再取得を行う。
    - cron: "45 22 * * 1-5"   # JST 7:45 — 取れれば取る（早い方）
    - cron: "0 5 * * 2-6"     # JST 14:00 — 確実に取る（ET 前日+α）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download swing store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download swing-store --repo "$GITHUB_REPOSITORY" --pattern swing_store.pkl --dir data --clobber

      - name: Verify swing store
        run: |
          test -f data/swing_store.pkl
          test "$(stat -c%s data/swing_store.pkl)" -ge 104857600

      - name: Run swing scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python -u -m pipeline.swing_scan

      - name: Upload updated swing store
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload swing-store data/swing_store.pkl --repo "$GITHUB_REPOSITORY" --clobber
